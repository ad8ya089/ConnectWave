# nginx/nginx.dev.conf — local Docker Compose (HTTP only, no TLS)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream signaling_servers {
        ip_hash;
        server signaling:4000;
    }

    upstream room_service {
        least_conn;
        server room-service:4001;
    }

    upstream chat_service {
        ip_hash;
        server chat-service:4002;
    }

    log_format main '$remote_addr -> $upstream_addr [$time_local] '
                    '"$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;

        location /nginx-health {
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }

        location /api/turn/ {
            proxy_pass http://room_service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /api/rooms {
            proxy_pass http://room_service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /chat/ {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/chat/ {
            proxy_pass http://chat_service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /socket.io/ {
            proxy_pass http://signaling_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://signaling_servers;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://signaling_servers;
        }
    }
}
