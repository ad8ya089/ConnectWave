# nginx/nginx.conf
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # -- Upstream: signaling servers (WebSocket, sticky) ----------------------
    # ip_hash gives sticky sessions so a client's WebSocket stays on one
    # instance. The compose service is named "signaling"; --scale signaling=N
    # adds more containers behind this same DNS name.
    upstream signaling_servers {
        ip_hash;
        server signaling:4000;
    }

    # -- Upstream: room service (stateless HTTP, round-robin) -----------------
    upstream room_service {
        least_conn;
        server room-service:4001;
    }

    # -- Upstream: chat service (WebSocket + REST, sticky) --------------------
    upstream chat_service {
        ip_hash;
        # Chat Service uses Socket.io — needs sticky sessions (same reason as signaling)
        server chat-service:4002;
    }

    log_format main '$remote_addr -> $upstream_addr [$time_local] '
                    '"$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;

        location /nginx-health {
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }

        # ── TURN credential endpoint ──────────────────────────────────────────
        # Routes to room-service (stateless, no sticky needed)
        location /api/turn/ {
            proxy_pass http://room_service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # -- Room Service REST API ---------------------------------------------
        # /api/rooms/* routes to room-service (stateless, round-robin)
        location /api/rooms {
            proxy_pass http://room_service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # ── Chat Service WebSocket ────────────────────────────────────────────
        location /chat/ {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ── Chat Service REST (history) ───────────────────────────────────────
        location /api/chat/ {
            proxy_pass http://chat_service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # -- Signaling Socket.io -----------------------------------------------
        location /socket.io/ {
            proxy_pass http://signaling_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # -- Signaling REST (health, other /api/ routes) -----------------------
        location /api/ {
            proxy_pass http://signaling_servers;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://signaling_servers;
        }
    }
}
