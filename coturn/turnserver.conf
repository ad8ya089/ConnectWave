# coturn/turnserver.conf
# Coturn — open-source TURN/STUN server
# Docs: https://github.com/coturn/coturn/wiki/turnserver

# ── Network ──────────────────────────────────────────────────────────────────

# The external IP of the server.
# In Docker Compose (local dev), this is overridden via CLI flags.
# In production, set this to your actual public IP.
# external-ip=YOUR_PUBLIC_IP

# Listening ports
listening-port=3478          # Standard TURN/STUN port (UDP + TCP)
tls-listening-port=5349      # TURN over TLS (used when UDP is blocked by firewall)

# ── Authentication ────────────────────────────────────────────────────────────

# Use time-limited HMAC credentials (RFC 5389 long-term credential mechanism).
# Credentials are generated by Room Service and have a short TTL (1 hour).
# This means the shared secret below is NEVER sent to the client —
# only the derived username:expiry + HMAC are sent.
# Even if someone intercepts credentials, they expire in ≤1 hour.
use-auth-secret

# The shared secret used to derive HMAC credentials.
# Must match TURN_SECRET in room-service/.env exactly.
# Change this to a strong random string in production.
static-auth-secret=dev-turn-secret-change-in-production

# Realm — identifies your TURN server. Can be any string.
realm=connectwave.app

# ── Relay ─────────────────────────────────────────────────────────────────────

# Limit relay traffic to audio/video port ranges (reduces attack surface)
min-port=49152
max-port=65535

# ── Security ──────────────────────────────────────────────────────────────────

# Drop connections from clients that haven't authenticated
no-cli

# Disable outdated/weak cipher support
no-sslv2
no-sslv3
no-tlsv1
no-tlsv1_1

# Prevent TURN server from being used as an open relay for arbitrary TCP/UDP
# (only relay WebRTC media, not arbitrary traffic)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# The above blocks RFC 1918 private ranges — prevents SSRF via TURN relay

# ── Logging ───────────────────────────────────────────────────────────────────

log-file=stdout
verbose
