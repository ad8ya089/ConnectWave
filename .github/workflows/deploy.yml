name: Deploy ConnectWave

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/connectwave

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build signaling server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-signaling:latest,${{ env.IMAGE_PREFIX }}-signaling:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build room service
        uses: docker/build-push-action@v5
        with:
          context: ./room-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-room-service:latest,${{ env.IMAGE_PREFIX }}-room-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build chat service
        uses: docker/build-push-action@v5
        with:
          context: ./chat-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-chat-service:latest,${{ env.IMAGE_PREFIX }}-chat-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx+client
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-nginx:latest,${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
          build-args: |
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
            VITE_ROOM_SERVICE_URL=${{ secrets.VITE_ROOM_SERVICE_URL }}
            VITE_CHAT_SERVICE_URL=${{ secrets.VITE_CHAT_SERVICE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/connectwave

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.IMAGE_PREFIX }}-signaling:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}-room-service:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}-chat-service:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}

            export SIGNALING_IMAGE=${{ env.IMAGE_PREFIX }}-signaling:${{ github.sha }}
            export ROOM_IMAGE=${{ env.IMAGE_PREFIX }}-room-service:${{ github.sha }}
            export CHAT_IMAGE=${{ env.IMAGE_PREFIX }}-chat-service:${{ github.sha }}
            export NGINX_IMAGE=${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}

            docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps \
              room-service chat-service

            docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps --scale signaling=1 signaling
            sleep 30
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps --scale signaling=2 signaling

            docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps nginx

            docker image prune -f

      - name: Verify deployment health
        run: |
          sleep 15
          curl -f https://your-domain.com/health || exit 1
          curl -f https://your-domain.com/nginx-health || exit 1
          echo "Deployment healthy"
